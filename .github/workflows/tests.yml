name: Tests

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew --build-cache assemble

      - name: Upload build outputs
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build
          if-no-files-found: error

  test-unit:
    name: test / unit
    runs-on: ubuntu-latest
    needs:
      - build

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Download build outputs
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: build

      - name: Run unit tests
        run: ./gradlew --build-cache test jacocoTestReport

      - name: Upload verified build outputs
        uses: actions/upload-artifact@v4
        with:
          name: verified-build-output
          path: build
          if-no-files-found: error

  package:
    name: package
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Download verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: verified-build-output
          path: build

      - name: Package application
        run: ./gradlew --build-cache --offline bootJar

  quality-crap-ai-agents:
    name: verify / quality-crap-ai-agents
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Download verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: verified-build-output
          path: build

      - name: Run crap-java gate
        run: ./gradlew --build-cache --offline crap-java-check

  quality-cognitive-ai-agents:
    name: verify / quality-cognitive-ai-agents
    runs-on: ubuntu-latest
    needs:
      - build
      - test-unit

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Set up JDK 25
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "25"
          cache: gradle

      - name: Ensure Gradle wrapper is executable
        run: chmod +x ./gradlew

      - name: Download verified build outputs
        uses: actions/download-artifact@v4
        with:
          name: verified-build-output
          path: build

      - name: Run cognitive-java gate
        run: ./gradlew --build-cache --offline cognitive-java-check
